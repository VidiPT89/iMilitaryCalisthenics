name: MilitaryCalisthenics
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  MilitaryCalisthenics:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MilitaryCalisthenics
    info:
      path: MilitaryCalisthenics/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.militarycalisthenics
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  MilitaryCalisthenics:
    build:
      targets:
        MilitaryCalisthenics: all
    run:
      config: Debug
    archive:
      config: Release
